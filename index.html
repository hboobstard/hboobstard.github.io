<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Me</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="poster">
            <h1>I WANT YOU</h1>

            <img
                src="images/we_want_you.webp"
                alt="You are invited to support me"
                class="main-image"
            >

            <h2>TO SUPPORT ME WITH MONEY!</h2>

            <p class="subtitle">(if you're able, of course)</p>
        </section>

        <section class="wallets">

            <h3>MY WALLETS</h3>

            <details class="wallet">
                <summary>MY BITCOIN WALLET</summary>

                <div class="wallet-content">

                    <p class="network-name">Bitcoin</p>

                    <div class="address-row">
                    
                        <p class="wallet-address">
                            bc1q073xqzxrtrm6dzq4k6jag0d65tz0sn95mnsynp
                        </p>

                        <button class="copy-button" type="button">
                            COPY ADDRESS
                        </button>

                    </div>

                    <img
                        src="images/bitcoin.png"
                        alt="Bitcoin wallet QR code"
                        class="qr-code"
                        width="197"
                        height="197"
                    >

                </div>
            </details>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
